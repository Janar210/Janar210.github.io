name: Deploy website

# The website is built by the private profile-src repo and published to the public
# gh-pages branch of Janar210/Janar210. This workflow copies that build to GitHub Pages
# here, so it is served at https://janar210.github.io (and janarthanan.is-a.dev).
# It needs no tokens: the source branch is public.
on:
  schedule:
    - cron: "50 * * * *"   # every hour, picks up any new build
  push:
    branches: [main]
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the latest website build
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}
          ref: gh-pages
          path: site

      - name: Drop git data and any custom-domain file (the domain is set in Settings → Pages)
        run: rm -rf site/.git site/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
